# ── harness-kit CI/CD ────────────────────────────────────────────────────────
# lint → test → security → build (no publish yet: @homelab/harness-hooks ships from its dist/ only when a consumer asks)
#
# Follows the homelab fleet standard (homelab/ci-templates README): templates pinned to a vX.Y.Z tag,
# the ci/lib scripts it and the security template call vendored and checked against that tag (lint:vendored-lib), the canonical workflow: block copied
# verbatim, images from the Harbor proxy and pinned, job names scoped by stage, shell in ci/*.sh.
# Pipelines run for merge requests and the default branch only.

include:
  - project: 'homelab/ci-templates'
    ref: 'v0.11.0'
    file: '/templates/security.yml'
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $DEPLOY_BRANCHES && $CI_COMMIT_BRANCH =~ $DEPLOY_BRANCHES
    - when: never

stages: [lint, test, security, build]

variables:
  GIT_SUBMODULE_STRATEGY: "none"
  CI_TEMPLATES_REF: 'v0.11.0'
  CI_TEMPLATES_URL: '${CI_SERVER_URL}/homelab/ci-templates.git'
  # The registry the job images are pulled through; the project's CI/CD variable of the same name points it at the mirror proxy.
  IMAGE_PROXY: 'docker.io'
  # Pipelines here run for merge requests and the default branch only; this lets SAST and Secret Detection run in merge request pipelines.
  AST_ENABLE_MR_PIPELINES: "true"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# GitLab's SAST and Secret Detection templates default to a 'test' stage and no runner tag; this pipeline scans in 'security', on the kubernetes runner.
sast:
  stage: security
  tags:
    - kubernetes

secret_detection:
  stage: security
  tags:
    - kubernetes

.bun:
  image: ${IMAGE_PROXY}/oven/bun:1.4.4
  tags:
    - kubernetes
  before_script:
    - bun install --frozen-lockfile

lint:vendored-lib:
  stage: lint
  image: ${IMAGE_PROXY}/library/node:22.23.3-bookworm
  tags:
    - kubernetes
  needs: []
  variables:
    VENDORED_PATHS: "ci/lib/common.sh ci/lib/check-vendored.sh ci/lib/scan-osv.sh ci/lib/scan-secrets.sh ci/lib/scan-trivy.sh ci/lib/scan-trivy-config.sh ci/lib/validate-kubeconform.sh"
  before_script:
    - bash ci/git-use-job-token.sh
  script:
    - bash ci/lib/check-vendored.sh

lint:shell:
  stage: lint
  image: ${IMAGE_PROXY}/koalaman/shellcheck-alpine:v0.11.0
  tags:
    - kubernetes
  needs: []
  script:
    - shellcheck --version
    - shellcheck ci/*.sh ci/lib/*.sh

lint:typecheck:
  extends: .bun
  stage: lint
  needs: []
  script:
    - bun run typecheck

lint:generated:
  extends: .bun
  stage: lint
  needs: []
  script:
    - bun run gen:check

test:unit:
  extends: .bun
  stage: test
  needs: []
  script:
    - bun run test

# The image, manifest and config scanners do not apply: this repo builds no image and ships no manifests.
# security:deps scans the lockfile offline, security:secrets scans the full history.
security:image:
  stage: security
  needs: []
  rules:
    - when: never

security:manifests:
  stage: security
  needs: []
  rules:
    - when: never

security:config:
  stage: security
  needs: []
  rules:
    - when: never

build:package:
  extends: .bun
  stage: build
  needs:
    - job: test:unit
  timeout: 20m
  script:
    - bun run build
  artifacts:
    paths:
      - packages/hooks/dist/
    expire_in: 30 days
