include:
  - project: 'homelab/ci-templates'
    ref: 'v0.11.0'
    file: '/templates/security.yml'
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $DEPLOY_BRANCHES && $CI_COMMIT_BRANCH =~ $DEPLOY_BRANCHES
    - when: never

stages: [lint, test, security, build, publish]

variables:
  GIT_SUBMODULE_STRATEGY: "none"
  CI_TEMPLATES_REF: 'v0.11.0'
  CI_TEMPLATES_URL: '${CI_SERVER_URL}/homelab/ci-templates.git'
  IMAGE_PROXY: 'docker.io'
  AST_ENABLE_MR_PIPELINES: "true"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

sast:
  stage: security
  tags:
    - kubernetes

secret_detection:
  stage: security
  tags:
    - kubernetes

.bun:
  image: ${IMAGE_PROXY}/oven/bun:1.4.4
  tags:
    - kubernetes
  before_script:
    - bun install --frozen-lockfile

lint:vendored-lib:
  stage: lint
  image: ${IMAGE_PROXY}/library/node:22.23.3-bookworm
  tags:
    - kubernetes
  needs: []
  variables:
    VENDORED_PATHS: "ci/lib/common.sh ci/lib/check-vendored.sh ci/lib/scan-osv.sh ci/lib/scan-secrets.sh ci/lib/scan-trivy.sh ci/lib/scan-trivy-config.sh ci/lib/validate-kubeconform.sh"
  before_script:
    - bash ci/git-use-job-token.sh
  script:
    - bash ci/lib/check-vendored.sh

lint:shell:
  stage: lint
  image: ${IMAGE_PROXY}/koalaman/shellcheck-alpine:v0.11.0
  tags:
    - kubernetes
  needs: []
  script:
    - shellcheck --version
    - shellcheck ci/*.sh ci/lib/*.sh

lint:typecheck:
  extends: .bun
  stage: lint
  needs: []
  script:
    - bun run typecheck

lint:generated:
  extends: .bun
  stage: lint
  needs: []
  script:
    - bun run gen:check

test:unit:
  stage: test
  image: ${IMAGE_PROXY}/library/node:22.23.3-bookworm
  tags:
    - kubernetes
  needs: []
  script:
    - npm install -g bun@1.4.4
    - bun install --frozen-lockfile
    - bun run build
    - bun run test

security:image:
  stage: security
  needs: []
  rules:
    - when: never

security:manifests:
  stage: security
  needs: []
  rules:
    - when: never

security:config:
  stage: security
  needs: []
  rules:
    - when: never

build:package:
  extends: .bun
  stage: build
  needs:
    - job: test:unit
  timeout: 20m
  script:
    - bun run build
  artifacts:
    paths:
      - packages/hooks/dist/
    expire_in: 30 days

publish:gitlab:
  image: ${IMAGE_PROXY}/library/node:22.23.3-bookworm
  tags:
    - kubernetes
  stage: publish
  needs:
    - job: lint:vendored-lib
    - job: lint:shell
    - job: lint:typecheck
    - job: test:unit
    - job: security:deps
    - job: security:secrets
    - job: build:package
      artifacts: true
  timeout: 20m
  interruptible: false
  resource_group: release
  script:
    - bash ci/publish-gitlab.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
